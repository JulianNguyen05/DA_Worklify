services:
  mysql:
    image: mysql:8.4
    container_name: worklify-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: worklify_db
      MYSQL_USER: worklify
      MYSQL_PASSWORD: worklify_password
    ports:
      - "3307:3306" # Map ra ngoài máy host ở port 3307 để không trùng MySQL có sẵn
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - worklify-network

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: worklify-phpmyadmin
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root123
    ports:
      - "8089:80"
    networks:
      - worklify-network

  # Dịch vụ AI (FastAPI). Backend chạy trên IDE gọi vào qua http://localhost:8000.
  backend-ml:
    build:
      context: ../backend-ml
    container_name: worklify-ml
    restart: unless-stopped
    environment:
      # Backend chạy trên máy host (IDE), nên từ trong container gọi ra qua host.docker.internal
      CORE_BASE_URL: http://host.docker.internal:8080
      INTERNAL_API_KEY: local-dev-only-change-me
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ../backend-ml/models:/app/models
      - ml_model_cache:/app/.cache   # giữ model đã tải từ Hugging Face giữa các lần chạy
    networks:
      - worklify-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

networks:
  worklify-network:
    driver: bridge

volumes:
  mysql_data:
  ml_model_cache:
